name: Publish and deploy SQLChat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize publication and deployment, including manual runs.
concurrency:
  group: sqlchat-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/p-jhao/sqlchat-backend
            build_args: ''
          - component: frontend
            image: ghcr.io/p-jhao/sqlchat-frontend
            build_args: |
              VITE_API_BASE_URL=/api
              VITE_GITHUB_REPO=https://github.com/P-Jhao/db-genius
    steps:
      # All action SHAs were verified against their upstream major tags.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=sqlchat-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=sqlchat-${{ matrix.component }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: sqlchat-ecs-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Transfer deployment files and deploy on ECS
        shell: bash
        env:
          ECS_HOST: ${{ secrets.SQLCHAT_ECS_HOST }}
          ECS_USER: ${{ secrets.SQLCHAT_ECS_USER }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.SQLCHAT_ECS_SSH_PRIVATE_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.SQLCHAT_ECS_KNOWN_HOSTS }}
          ECS_SSH_PORT: ${{ vars.SQLCHAT_ECS_SSH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Set SQLCHAT_ECS_HOST}"
          : "${ECS_USER:?Set SQLCHAT_ECS_USER}"
          : "${ECS_SSH_PRIVATE_KEY:?Set SQLCHAT_ECS_SSH_PRIVATE_KEY}"
          : "${ECS_KNOWN_HOSTS:?Set SQLCHAT_ECS_KNOWN_HOSTS}"
          : "${GHCR_TOKEN:?Missing GITHUB_TOKEN}"
          ecs_port="${ECS_SSH_PORT:-22}"
          [[ "$ECS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$ECS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$ecs_port" =~ ^[0-9]{1,5}$ ]]
          (( 10#$ecs_port >= 1 && 10#$ecs_port <= 65535 ))
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          test -f deploy/docker-compose.prod.yml
          test -f deploy/deploy-on-server.sh
          test -f deploy/trial-mode.py
          test -f deploy/docker-compose.trial.yml
          test -f deploy/trial-mysql/10-demo.sh
          test -f deploy/trial-mysql/demo.sql

          umask 077
          ssh_directory=$(mktemp -d "$RUNNER_TEMP/sqlchat-ssh.XXXXXX")
          cleanup_runner() {
            rm -rf -- "$ssh_directory"
          }
          trap cleanup_runner EXIT
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > "$ssh_directory/id"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          unset ECS_SSH_PRIVATE_KEY ECS_KNOWN_HOSTS
          ssh_options=(
            -i "$ssh_directory/id"
            -o "UserKnownHostsFile=$ssh_directory/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
          )
          target="$ECS_USER@$ECS_HOST"
          ssh "${ssh_options[@]}" -p "$ecs_port" "$target" \
            'set -eu; install -d -m 700 "$HOME/sqlchat-deploy" "$HOME/sqlchat-deploy/trial-mysql"; test -f "$HOME/sqlchat-deploy/.env.production"'
          scp "${ssh_options[@]}" -P "$ecs_port" \
            deploy/docker-compose.prod.yml deploy/deploy-on-server.sh deploy/trial-mode.py deploy/docker-compose.trial.yml \
            "$target:sqlchat-deploy/"
          scp "${ssh_options[@]}" -P "$ecs_port" \
            deploy/trial-mysql/10-demo.sh deploy/trial-mysql/demo.sql \
            "$target:sqlchat-deploy/trial-mysql/"

          # This is static shell source. Credentials are sent only on SSH stdin.
          # Keep this heredoc free of single quotes for the remote bash -c wrapper.
          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          IFS= read -r registry_token
          IFS= read -r registry_user
          IFS= read -r image_tag
          umask 077
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          cleanup_registry() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup_registry EXIT
          trap "exit 130" INT
          trap "exit 143" TERM
          printf "%s" "$registry_token" | docker login ghcr.io --username "$registry_user" --password-stdin
          unset registry_token
          bash "$HOME/sqlchat-deploy/deploy-on-server.sh" "$image_tag"
          REMOTE
          )
          printf '%s\n' "$GHCR_TOKEN" "$GHCR_USER" "$IMAGE_TAG" | \
            ssh "${ssh_options[@]}" -p "$ecs_port" "$target" "bash -c '$remote_script'"
