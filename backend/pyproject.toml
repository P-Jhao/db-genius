[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlchat-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
 "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
 "pymysql>=1.1,<2", "pymongo>=4.11,<5", "oracledb>=3,<4", "pymssql>=2.3,<3",
 "cryptography>=44", "bcrypt>=4.2,<6", "python-multipart>=0.0.20",
 "celery>=5.4,<6", "httpx>=0.28,<1", "sqlglot>=26,<30",
 "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2",
 "langgraph-checkpoint-postgres>=3,<4", "openpyxl>=3.1,<4", "xlrd>=2,<3",
 "python-docx>=1.1,<2", "pypdf>=5,<7", "oss2>=2.19,<3",
 "alibabacloud-ocr-api20210707>=3,<4", "alibabacloud-tea-openapi>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.15"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
